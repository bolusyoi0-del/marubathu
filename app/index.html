<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マルバツゲーム</title>
<style>
:root{
  --bg:#f3f7ff; --card:#ffffff; --ink:#23304d; --sub:#6b7a99; --line:#cfdaf3;
  --o:#ff6f8f; --x:#3a7bff; --accent:#3a7bff; --accent-ink:#ffffff; --win:#fff1b8; --target:#ff9f1c; --chipbg:#e6eeff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161c2c; --card:#202942; --ink:#eaf0ff; --sub:#9fb0d6; --line:#3a4668;
    --o:#ff8ea6; --x:#7aa5ff; --accent:#7aa5ff; --accent-ink:#10203f; --win:#4d4520; --target:#ffb84d; --chipbg:#2c3858;
  }
}
:root[data-theme="dark"]{
  --bg:#161c2c; --card:#202942; --ink:#eaf0ff; --sub:#9fb0d6; --line:#3a4668;
  --o:#ff8ea6; --x:#7aa5ff; --accent:#7aa5ff; --accent-ink:#10203f; --win:#4d4520; --target:#ffb84d; --chipbg:#2c3858;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  display:flex;justify-content:center;padding:18px 14px}
main{width:100%;max-width:440px;text-align:center}
h1{font-size:1.45rem;margin:4px 0 12px}
h1.title-logo{width:100%;margin:0 auto 10px;line-height:0}
h1.title-logo img{display:block;width:100%;height:auto;max-height:250px;object-fit:contain}
.opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:7px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#rule{font-size:.78rem;color:var(--sub);margin:6px 0 10px}
  .start-match{display:block;margin:12px auto 16px;padding:12px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff65a8,#a94de8);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 #bd4b91,0 8px 18px #d95ca855;cursor:pointer}
  .start-match:active{transform:translateY(3px);box-shadow:0 2px 0 #bd4b91}
  .start-match[hidden]{display:none}
#status{font-size:1.1rem;font-weight:700;min-height:1.7em;margin:4px 0}
#note{font-size:.85rem;color:var(--sub);min-height:1.3em;margin-bottom:8px}
#board{display:grid;grid-template-rows:repeat(3,1fr);gap:5px;
  width:100%;aspect-ratio:1;background-color:transparent;background-position:center;
  background-size:100% 100%;background-repeat:no-repeat;padding:15% 10% 13%;
  border-radius:0;overflow:hidden}
.cell{min-width:0;min-height:0;aspect-ratio:1;border:0;border-radius:5px;
  background:rgba(255,255,255,.16);font:inherit;
  font-size:clamp(2.4rem,14vw,4rem);font-weight:700;color:var(--ink);line-height:1;cursor:pointer;padding:0}
#board.n5 .cell{font-size:clamp(1.5rem,8.5vw,2.5rem)}
.skin-pick{margin:8px 0 12px;text-align:left}
.skin-title{font-size:.8rem;color:var(--sub);font-weight:700;margin:0 2px 5px}
.skin-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.skin-option{min-width:0;border:2px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--ink);padding:4px 3px 5px;font:inherit;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:2px}
.skin-option[aria-pressed="true"]{border-color:var(--accent);background:var(--chipbg);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.skin-option img{width:100%;height:66px;object-fit:contain;display:block}
.simple-preview{width:100%;height:66px;display:grid;grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);gap:3px;padding:8px;background:var(--line);border-radius:8px}
.simple-preview i{display:block;background:var(--card);border-radius:3px}

.skin-option b{font-size:.72rem;line-height:1.2}
.cell.skin-on{background-image:none!important}
.cell.skin-on img{width:82%;height:82%;object-fit:contain}
.cell.skin-on.win{background-color:rgba(255,241,184,.48)}
#board.n5{grid-template-rows:repeat(5,1fr);gap:3px;padding:15% 10% 13%}
#board.n5 .cell{border-radius:3px}
#board.simple-board .cell{background:var(--card)}
#board .cell{position:relative}
#board .cell.target{outline:2px dashed var(--target);outline-offset:-4px}
#board .cell.win{background:var(--win)}
@media(max-width:360px){.skin-option img{height:56px}.skin-choices{gap:4px}}

.cell.o{color:var(--o)} .cell.x{color:var(--x)}
.cell.win{background:var(--win)}
.cell.target{outline:3px dashed var(--target);outline-offset:-3px}
.pickrow{margin:6px 0 2px;text-align:left}
.pickrow>span{font-size:.78rem;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.card{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;
  padding:6px 4px;font:inherit;font-size:.72rem;line-height:1.35;cursor:pointer;text-align:center}
.card svg{width:44px;height:44px;display:block;margin:0 auto 2px}
.card b{display:block;font-size:.85rem}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--chipbg)}
.card:disabled{cursor:default}
.skrow{display:flex;align-items:center;gap:8px;margin-top:10px;text-align:left}
.skrow svg{width:36px;height:36px;flex:0 0 36px}
.who{flex:0 0 5.6em;font-size:.78rem;color:var(--sub);line-height:1.3}
.sk{display:flex;gap:6px;flex-wrap:wrap}
.sk button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:7px 9px;font:inherit;font-size:.8rem;cursor:pointer}
.sk button.on{background:var(--target);color:#2a1a00;border-color:var(--target)}
.sk button.used{text-decoration:line-through}
.sk button:disabled{opacity:.4;cursor:default}
.score{display:flex;justify-content:space-around;margin:14px 0;color:var(--sub);font-size:.9rem}
.score b{color:var(--ink);font-size:1.15rem}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:relative}
#banner{position:absolute;left:0;right:0;top:38%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:linear-gradient(90deg,transparent,rgba(255,111,143,.93) 18%,rgba(255,111,143,.93) 82%,transparent);color:#fff;font-weight:700;pointer-events:none;opacity:0;text-align:left}
#banner svg{width:52px;height:52px}
#banner.show{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:translateX(-60%) scale(.9)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(40%)}}
#stage.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(3px,1px)}}
.cell{position:relative}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.cell.fx-flip{animation:flp .6s}
@keyframes flp{to{transform:rotateY(360deg)}}
.cell.fx-swap{animation:swp .5s}
@keyframes swp{40%{transform:scale(1.35) rotate(12deg)}to{transform:none}}
.cell.fx-erase::after{content:'💥';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;animation:puff .6s forwards}
@keyframes puff{0%{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.cell,#banner,#stage{animation:none!important}.cell::after{display:none}}
.nbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;cursor:pointer}
#code{padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:9.5em}
.nm{font-size:.8rem;color:var(--sub);margin:4px 0}
#cut{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(12,0,28,.78);overflow:hidden;cursor:pointer}
#cut.on{display:flex}
#cut::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,0) 0 3deg,rgba(255,255,255,.2) 3deg 4deg);animation:spn 2s linear infinite}
@keyframes spn{to{transform:rotate(30deg)}}
#cut .ci{position:relative;width:min(94vw,540px);aspect-ratio:16/9;filter:drop-shadow(0 0 22px var(--gl,#fff))}
#cut.on .ci{animation:cil .55s cubic-bezier(.15,1.15,.3,1) both}
#cut.r.on .ci{animation-name:cir}
@keyframes cil{from{transform:translateX(-130%) skewX(-10deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes cir{from{transform:translateX(130%) skewX(10deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
#cut img{width:100%;height:100%;object-fit:contain;display:block}
#cut .nm{position:absolute;left:0;right:0;bottom:-4px;text-align:center;color:#fff;font-weight:900;font-size:clamp(1.3rem,7vw,2.3rem);text-shadow:-2px -2px 0 var(--gl),2px -2px 0 var(--gl),-2px 2px 0 var(--gl),2px 2px 0 var(--gl),0 4px 10px rgba(0,0,0,.5)}
#cut.on .nm{animation:cpun .35s .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cpun{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
#cut .fl{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
#cut.on .fl{animation:cfl .5s .25s ease-out}
@keyframes cfl{0%{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion:reduce){#cut::before,#cut .ci,#cut .nm,#cut .fl{animation:none!important}}
.cell img{width:90%;height:90%;object-fit:contain;pointer-events:none;display:block;margin:auto}
.card img.sp{width:100%;height:auto;display:block;image-rendering:auto}
.skrow img{width:40px;height:40px;flex:0 0 40px;object-fit:cover;object-position:50% 8%;border-radius:50%;background:var(--chipbg)}
#stage.lock .cell{pointer-events:none}
#board{position:relative;z-index:1}#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.cell.pop-m{animation:pm .45s}
@keyframes pm{0%{transform:scale(.3)}30%{transform:scale(1.35,.6)}55%{transform:scale(.8,1.3)}80%{transform:scale(1.08,.94)}to{transform:none}}
.cell.pop-l{animation:pl .5s}
@keyframes pl{0%{transform:scale(.4) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.cell.pop-h{animation:ph .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes ph{0%{transform:translateY(-60%) scale(1.5);opacity:0}70%{transform:translateY(5%) scale(.95);opacity:1}to{transform:none}}

#victory{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:14px;background:rgba(10,5,28,.88);overflow:hidden;cursor:pointer;isolation:isolate}
#victory.on{display:flex}
#victory::before{content:'';position:absolute;inset:-55%;z-index:-1;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0 8deg,rgba(255,255,255,.22) 8deg 10deg);
  animation:vspin 12s linear infinite}
#victory::after{content:'';position:absolute;inset:0;z-index:-1;opacity:.8;
  background:radial-gradient(circle at 50% 48%,var(--vcolor),transparent 65%)}
@keyframes vspin{to{transform:rotate(360deg)}}
#victory .victory-card{position:relative;width:min(96vw,900px);aspect-ratio:16/9;
  filter:drop-shadow(0 0 24px var(--vcolor));}
#victory img{width:100%;height:100%;object-fit:contain;display:block;border-radius:12px}
#victory.on .victory-card{animation:vin .72s cubic-bezier(.12,1.25,.28,1) both}
@keyframes vin{0%{opacity:0;transform:scale(.42) rotate(-5deg)}65%{opacity:1;transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#victory .v-hint{position:absolute;bottom:12px;left:0;right:0;color:#fff;text-align:center;
  font-size:.82rem;font-weight:700;text-shadow:0 2px 8px #000;opacity:.9}
#victory.mika{--vcolor:rgba(255,55,150,.65)}
#victory.luna{--vcolor:rgba(145,80,255,.68)}
#victory.haru{--vcolor:rgba(255,145,25,.68)}
#victory.welza{--vcolor:rgba(174,55,255,.72)}
#victory.draw{--vcolor:rgba(125,90,255,.72)}
@media (prefers-reduced-motion:reduce){#victory::before,#victory.on .victory-card{animation:none!important}}


/* ===== Princess pink settings theme ===== */
:root{
  --bg:#fff3f8;
  --card:#fffafd;
  --ink:#713b60;
  --sub:#a66d91;
  --line:#f3c5dc;
  --o:#f04f9b;
  --x:#8b68e8;
  --accent:#ec65a8;
  --accent-ink:#fff;
  --win:#fff0b5;
  --target:#ffb84d;
  --chipbg:#ffe3f0;
}
:root[data-theme="dark"]{
  --bg:#281a2b;
  --card:#3b263d;
  --ink:#ffeaf5;
  --sub:#d5a4c3;
  --line:#754766;
  --o:#ff8fc4;
  --x:#b5a0ff;
  --accent:#d95b9d;
  --accent-ink:#fff;
  --win:#59472e;
  --target:#ffc56a;
  --chipbg:#57344e;
}
body{
  background:
    radial-gradient(ellipse at 8% 0%,rgba(255,190,220,.42),transparent 34%),
    radial-gradient(ellipse at 95% 15%,rgba(220,195,255,.35),transparent 30%),
    var(--bg);
}
main{max-width:460px}
main > .opts,
.skin-pick,
#netbox,
#pick{
  position:relative;
  margin:10px 0;
  padding:12px 10px 10px;
  border:1.5px solid var(--line);
  border-radius:19px;
  background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,235,246,.9));
  box-shadow:0 4px 12px rgba(190,94,145,.09),inset 0 1px 0 rgba(255,255,255,.95);
}
:root[data-theme="dark"] main > .opts,
:root[data-theme="dark"] .skin-pick,
:root[data-theme="dark"] #netbox,
:root[data-theme="dark"] #pick{
  background:linear-gradient(145deg,#432b46,#35233b);
  box-shadow:0 4px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.06);
}
main > .opts::before{
  display:block;
  flex:0 0 100%;
  margin:0 0 7px;
  color:#bd5e91;
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.08em;
  text-align:left;
  content:"設定";
}
main > .opts[aria-label="ばんのおおきさ"]::before{content:"✧ ばんの大きさ ✧"}
main > .opts[aria-label="あそび方"]::before{content:"♡ あそび方 ♡"}
main > .opts[aria-label="演出"]::before{content:"✦ 演出 ✦"}
main > .opts[aria-label="必殺技で仕留める"]::before{content:"♛ 技で仕留める ♛"}
main > .opts[aria-label="必殺技回数"]::before{content:"必殺技回数"}

  background:linear-gradient(180deg,#fff 0%,#fff1f7 100%);
  color:#85486c;
  box-shadow:0 2px 4px rgba(192,95,147,.08);

.chip{font-weight:700}

.skin-option b{color:#87466e;font-weight:900}

/* Character-specific illustrated special-move buttons */
.sk{flex:1;min-width:0;display:flex;align-items:center}
.sk button.skill-art{
  display:block;width:100%;min-width:0;padding:0;border:0;background:transparent;
  border-radius:4px;overflow:visible;line-height:0;box-shadow:none;
}
.sk button.skill-art img{display:block;width:100%;height:auto;max-height:76px;object-fit:contain;border-radius:4px}
.sk button.skill-art.on{background:transparent;box-shadow:0 0 0 2px #f06cab,0 0 10px rgba(239,92,166,.42)}
.sk button.skill-art.used{filter:grayscale(.85);opacity:.42}
.sk button.skill-art:disabled{opacity:.5}
.sk button.skill-art:active:not(:disabled){transform:scale(.985)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}


.extra-setting{margin:8px 0 12px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--card);text-align:left}
.extra-title{font-size:.82rem;color:var(--sub);font-weight:700;margin:0 0 7px}
.extra-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:9px}
.extra-row:last-child{margin-bottom:0}
.extra-row .chip{font-size:.78rem}
.cpu-choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cpu-choice button{border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:5px 3px;font:inherit;font-size:.75rem;cursor:pointer;min-width:0}
.cpu-choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--chipbg)}
.cpu-choice img{display:block;width:100%;height:58px;object-fit:contain}

  // Rank the opponent's legal replies after Aoi has placed her own mark.
  // Immediate wins are preferred, then immediate blocks, then the strongest open line.
  function bestMoveFor(p){
    var e=empties(board),q=opp(p),i,j,best=-1,bestScore=-Infinity;
    if(!e.length)return -1;
    // On the classic 3x3 board, use a complete minimax search for a truly optimal reply.
    // Always prioritize a square where the opponent can win immediately.
    // This must run before minimax so a tactical win is never overlooked.
    for(i=0;i<e.length;i++){
      var immediate=board.slice();immediate[e[i]]=p;
      if(wins(immediate,p))return e[i];
    }
    // On 3x3, evaluate each candidate as a move by p (the player to be blocked),
    // then let q respond. The previous version accidentally placed q first,
    // which could select an unrelated square instead of p's winning square.
    if(N===3&&K===3){
      function minimax(b,next,depth){
        if(wins(b,p))return 10-depth;
        if(wins(b,q))return depth-10;
        var open=[];for(var m=0;m<b.length;m++)if(!b[m]&&m!==freezeLockIndex)open.push(m);
        if(!open.length)return 0;
        var bestVal=next===p?-Infinity:Infinity;
        for(var n=0;n<open.length;n++){
          var at=open[n];b[at]=next;
          var val=minimax(b,opp(next),depth+1);b[at]=null;
          if(next===p)bestVal=Math.max(bestVal,val);else bestVal=Math.min(bestVal,val);
        }
        return bestVal;
      }
      var exact=-1,exactScore=-Infinity;
      for(i=0;i<e.length;i++){
        var trial=board.slice();trial[e[i]]=p;
        var replyScore=minimax(trial,q,1);
        if(replyScore>exactScore){exactScore=replyScore;exact=e[i];}
      }
      return exact;
    }
    for(i=0;i<e.length;i++){
      var block=board.slice();block[e[i]]=q;
      if(wins(block,q))return e[i];
    }
    for(i=0;i<e.length;i++){
      var idx=e[i],score=0;
      for(j=0;j<windows.length;j++){
        var line=windows[j];if(line.indexOf(idx)<0)continue;
        var own=0,enemy=0;
        for(var z=0;z<line.length;z++){
          var v=board[line[z]];
          if(v===p)own++;else if(v===q)enemy++;
        }
        if(enemy===0)score+=Math.pow(7,own);
      }
      var row=Math.floor(idx/N),col=idx%N,mid=(N-1)/2;
      score+=(N-Math.abs(row-mid)-Math.abs(col-mid))*0.15;
      if(score>bestScore){bestScore=score;best=idx;}
    }
    return best;
  }
  function clearFreezeLock(){
    if(freezeLockIndex>=0){
      var old=freezeLockIndex;freezeLockIndex=-1;freezeLockVictim=null;
      if(cells[old])cells[old].dataset.m='';
    }
  }
  function bestEnemyPieceToDestroy(p){
    var enemy=opp(p),best=-1,bestScore=-Infinity;
    for(var i=0;i<board.length;i++){
      if(board[i]!==enemy)continue;
      var test=board.slice();test[i]=null;
      var score=0,enemyWins=0,enemyForks=0,ownThreats=0;
      // Reward removing a mark that participates in immediate or developing threats.
      for(var w=0;w<windows.length;w++){
        var line=windows[w],enemyCount=0,ownCount=0,contains=false;
        for(var j=0;j<line.length;j++){
          if(line[j]===i)contains=true;
          if(test[line[j]]===enemy)enemyCount++;
          if(test[line[j]]===p)ownCount++;
        }
        if(contains&&ownCount===0&&enemyCount>0){
          score+=enemyCount===K-1?1200:enemyCount===K-2?260:enemyCount*45;
        }
      }
      // Count the opponent's winning replies before and after removal; removing a
      // fork-producing piece is especially valuable.
      for(var e=0;e<test.length;e++)if(!test[e]){
        test[e]=enemy;if(wins(test,enemy))enemyWins++;test[e]=null;
      }
      if(enemyWins>0)score+=enemyWins*500;
      if(enemyWins>=2)score+=900;
      // Prefer a mark whose removal opens more useful lines for our own attack.
      for(var w2=0;w2<windows.length;w2++){
        var line2=windows[w2],pc=0,ec=0;
        for(var k=0;k<line2.length;k++){if(test[line2[k]]===p)pc++;if(test[line2[k]]===enemy)ec++;}
        if(ec===0&&pc>0)ownThreats+=pc*pc;
      }
      score+=ownThreats*18;
      // Stable tie-break: central / multi-line squares naturally score higher.
      if(score>bestScore){bestScore=score;best=i;}
    }
    return best;
  }
  function activateAoiFreeze(p,beforeLock){

    render();setStatus();
    // Cut-in -> lock the opponent's best square on the current board -> destroy
    // a dangerous opposing mark -> hand the turn to the opponent.
    say(p,function(){
      // CPU matches reveal the cut-in first, then place the mark before resolving the freeze.
      if(typeof beforeLock==='function')beforeLock();
      // Aoi's placed mark may already complete a line. End the match immediately;
      // do not resolve the freeze or pass the turn first.
      if(checkEnd())return;
      // Determine and apply the lock BEFORE removing an opposing mark.
      // This prevents the newly emptied destruction square from being locked too.
      var target=bestMoveFor(opp(p));

  function performSoraShuffle(p,done){
    // True permutation: every O, X and empty square is included exactly once.
    busy=true;pending=null;
    clearFreezeLock();
    noteEl.textContent='🍃 ソラ「ウィンドシャッフル」！';
    var stage=document.getElementById('stage');

    // Remove any remnants from a previous shuffle/placement animation first.
    cells.forEach(function(cell){
      cell.classList.remove('sora-shuffling','pop','pop-m','pop-l','pop-h','pop-a','pop-s','fx-flip','fx-swap');
      cell.style.removeProperty('--wind-x');
      cell.style.removeProperty('--wind-y');
      cell.style.removeProperty('animation-delay');
    });
    fxk={};
    popUntil={};
    stage.classList.remove('sora-wind');
    render();
    void stage.offsetWidth;
    stage.classList.add('sora-wind');
    startSoraShuffleSfx();

    var side=Math.round(Math.sqrt(cells.length))||3;
    var center=(side-1)/2;
    // Exact square spiral: center first, then each ring clockwise along
    // its four straight edges.  Every ring finishes at its top-left corner.
    // This avoids the diagonal corner-skips produced by polar-angle sorting.
    var order=[];
    function addRingCell(x,y,ring){
      var index=(y+center)*side+(x+center);
      order.push({cell:cells[index],index:index,ring:ring,x:x,y:y});
    }
    addRingCell(0,0,0);
    for(var ring=1;ring<=center;ring++){
      // Top edge: just right of the top-left corner through top-right.
      for(var tx=-ring+1;tx<=ring;tx++)addRingCell(tx,-ring,ring);
      // Right edge: continue downward, including bottom-right.
      for(var ry=-ring+1;ry<=ring;ry++)addRingCell(ring,ry,ring);
      // Bottom edge: continue leftward, including bottom-left.
      for(var bx=ring-1;bx>=-ring;bx--)addRingCell(bx,ring,ring);
      // Left edge: travel upward, stopping just below top-left.
      for(var ly=ring-1;ly>=-ring+1;ly--)addRingCell(-ring,ly,ring);
      // Close the square with the top-left corner as the final cell.
      addRingCell(-ring,-ring,ring);
    }

    // A gentle clockwise tangent drift gives the sequential one-turn spin a whirlpool feel.
    var stagger=.105;
    order.forEach(function(item,rank){
      var radius=Math.sqrt(item.x*item.x+item.y*item.y);
      var nx=radius?item.x/radius:0;
      var ny=radius?item.y/radius:0;
      var drift=item.ring===0?0:Math.min(18,9+item.ring*4.5);
      item.cell.style.setProperty('--wind-x',(-ny*drift).toFixed(1)+'px');
      item.cell.style.setProperty('--wind-y',(nx*drift).toFixed(1)+'px');
      item.cell.style.animationDelay=(rank*stagger).toFixed(3)+'s';
      item.cell.classList.add('sora-shuffling');
    });
    setStatus();

    // Hold the board until the last square's single 360-degree turn has landed.
    var lastStart=(order.length-1)*stagger*1000;
    setTimeout(function(){
      stopSoraShuffleSfx();
      var shuffled=board.slice();
      for(var i=shuffled.length-1;i>0;i--){
        var j=Math.floor(gameRandom()*(i+1));
        var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;
      }
      board=shuffled;
      fxk={};
      cells.forEach(function(cell){
        cell.classList.remove('sora-shuffling');
        cell.style.removeProperty('--wind-x');
        cell.style.removeProperty('--wind-y');
        cell.style.removeProperty('animation-delay');
      });
      stage.classList.remove('sora-wind');
      render();
      setTimeout(function(){
        busy=false;
        if(checkEnd())return;
        if(typeof done==='function')done();
      },260);
    },lastStart+900);
  }

  function evalB(b){
    var s=0;
    windows.forEach(function(w){
      var o=0,x=0;
      for(var t=0;t<w.length;t++){if(b[w[t]]==='O')o++;else if(b[w[t]]==='X')x++;}
      if(o===0&&x>0)s+=Math.pow(8,x);
      if(x===0&&o>0)s-=Math.pow(8,o)*1.1;

  }
  function oppCanWin(b,p){
    for(var i=0;i<b.length;i++){if(b[i]||i===freezeLockIndex)continue;b[i]=p;var w=wins(b,p);b[i]=null;if(w)return true;}
    return false;
  }
  function cpuShouldUseSkill(mark,extraMoves){
    var occupied=board.filter(Boolean).length+(extraMoves||0);
    var unlock=cpuSkillUnlockAt[mark]|| (K===3?3:5);
    if(occupied<unlock)return false;
    // Usually save the skill for a more interesting moment, but use it more readily
    // when the opponent is threatening an immediate win.
    var threatened=oppCanWin(board,opp(mark));
    return threatened||Math.random()<0.58;
  }

  function cpuChoose(){
    var cpuMark=opp(humanMark);
    var b=board.map(function(v){return v===cpuMark?'X':v===humanMark?'O':null;}),e=empties(b),i,j;
    if(cfg.mode==='weak'){
      for(i=0;i<e.length;i++){b[e[i]]='X';var w=wins(b,'X');b[e[i]]=null;if(w)return{type:'place',i:e[i]};}
      return{type:'place',i:e[Math.floor(Math.random()*e.length)]};
    }
    var candidates=[],m=K===3?1:6;
    function consider(a,nb,cost){
      var v;
      if(wins(nb,'X'))v=1e9;else{v=evalB(nb)-cost;if(oppCanWin(nb,'O'))v-=1e6;}
      candidates.push({action:a,score:v});
    }
    e.forEach(function(i){var nb=b.slice();nb[i]='X';consider({type:'place',i:i},nb,0);});
    var cpuSide=opp(humanMark),key=ch(cpuSide).skill;
    if(cfg.skills&&skills[cpuSide]&&key!=='freeze'&&cpuShouldUseSkill(cpuSide,0)){
      if(key==='erase'){
        for(j=0;j<b.length;j++){
          if(b[j]!=='O')continue;
          var n1=b.slice();n1[j]=null;var bk=-1,bs=-Infinity;
          for(var q=0;q<b.length;q++){if(n1[q]!=='O')continue;var n5=n1.slice();n5[q]=null;var sc=evalB(n5);if(sc>bs){bs=sc;bk=q;}}
          if(bk>=0)n1[bk]=null;
          consider({type:'erase',i:j,k:bk},n1,(bk>=0?60:40)*m);
        }
      }else if(key==='flip'){
        for(j=0;j<b.length;j++){
          if(b[j]!=='O')continue;
          var n1=b.slice();n1[j]='X';if(!cfg.kill&&wins(n1,'X'))continue;consider({type:key,i:j},n1,40*m);
        }
      }else if(key==='freeze'){
        // Aoi's freeze skill is activated after her normal placement in cpuTurn().
        // Do not evaluate it as a swap action; there is no separate board move to score here.
      }else if(key==='swap'){
        for(j=0;j<b.length;j++){
          if(b[j])continue;
          for(var q=0;q<b.length;q++){if(b[q]!=='O')continue;var n3=b.slice();n3[j]='O';n3[q]='X';if(!cfg.kill&&wins(n3,'X'))continue;consider({type:'swap',j:j,i:q},n3,40*m);}
        }
      }
    }
    if(!candidates.length)return null;
    // Keep tactically strong moves, but add enough controlled variety that repeated
    // matchups do not replay the exact same opening every time.
    var top=-Infinity;
    candidates.forEach(function(c){if(c.score>top)top=c.score;});
    var varietyBand=K===3?18:55;
    var pool=candidates.filter(function(c){return c.score>=top-varietyBand;});
    // Never randomize away an immediate winning move.
    if(top>=1e9)pool=candidates.filter(function(c){return c.score>=1e9;});
    return pool[Math.floor(Math.random()*pool.length)].action;
  }
  function cpuTurn(){
    if(cfg.mode==='watch')humanMark=opp(turn);
    var cpuMark=cfg.mode==='watch'?turn:opp(humanMark);
    var nextTurn=opp(cpuMark);
    function continueCpuTurn(){
      if(freezeLockVictim===cpuMark){
        busy=true;freezeBreakingIndex=freezeLockIndex;render();setStatus();
        setTimeout(function(){
          clearFreezeLock();freezeBreakingIndex=-1;
          render();busy=false;
          if(checkEnd())return;
          turn=nextTurn;if(blackholeIndex>=0&&turn===blackholeOwner)fadeOutBlackhole();render();setStatus();
          if(cfg.mode==='watch'&&!over)cpuTurn();
        },760);
        return;
      }
      if(checkEnd())return;
      turn=nextTurn;if(blackholeIndex>=0&&turn===blackholeOwner)fadeOutBlackhole();render();setStatus();
      if(cfg.mode==='watch'&&!over)cpuTurn();
    }
    busy=true;render();
    setTimeout(function(){
      var a=cpuChoose();
      if(cfg.skills&&chars[cpuMark]==='welza'&&skills[cpuMark]&&cpuShouldUseSkill(cpuMark,0)){
        var bhTargets=[];for(var bi=0;bi<board.length;bi++)if(bi!==blackholeIndex)bhTargets.push(bi);
        if(bhTargets.length){
          // cpuTurn enters with busy=true; release that guard before routing the
          // CPU's chosen square through the normal black-hole placement handler.
          // handle() immediately takes busy again and owns the asynchronous skill flow.
          busy=false;turn=cpuMark;pending='blackhole';remote=true;
          handle(bhTargets[Math.floor(Math.random()*bhTargets.length)]);
          remote=false;return;
        }
      }
      if(!a){
        busy=false;
        if(freezeLockVictim===cpuMark)clearFreezeLock();
        turn=nextTurn;if(blackholeIndex>=0&&turn===blackholeOwner)fadeOutBlackhole();render();setStatus();
        if(cfg.mode==='watch'&&!over)cpuTurn();
        return;
      }
      // Aoi: show the cut-in first, then place her mark, then resolve the freeze.
      if(a.type==='place'&&cfg.skills&&chars[cpuMark]==='aoi'&&skills[cpuMark]&&cpuShouldUseSkill(cpuMark,1)&&!checkEnd()){
        consumeSkill(cpuMark);turn=cpuMark;
        activateAoiFreeze(cpuMark,function(){
          board[a.i]=cpuMark;playCharacterPlaceSfx(cpuMark);render();
        });
        return;
      }
      // Sora places her mark first, then reveals the cut-in and shuffles every square.
      if(a.type==='place'&&cfg.skills&&chars[cpuMark]==='sora'&&skills[cpuMark]&&cpuShouldUseSkill(cpuMark,1)&&!checkEnd()){
        consumeSkill(cpuMark);turn=cpuMark;busy=true;render();
        board[a.i]=cpuMark;playCharacterPlaceSfx(cpuMark);render();
        say(cpuMark,function(){
          performSoraShuffle(cpuMark,function(){finishTurnAfterLock(cpuMark,nextTurn);});
        });
        return;
      }
      // Mika and Luna's skill actions now resolve only after their cut-in has finished.
      if(a.type==='erase'||a.type==='flip'){
        busy=true;render();
        say(cpuMark,function(){
          if(a.type==='erase'){
            board[a.i]=null;fxk[a.i]='erase';
            if(a.k>=0){fxk[a.k]='erase';board[a.k]=null;}
          }else{
            board[a.i]=cpuMark;fxk[a.i]='flip';
          }
          consumeSkill(cpuMark);render();busy=false;
          continueCpuTurn();
        });
        return;
      }
      // Ordinary CPU placement (no skill) remains a normal visible move.
      if(a.type==='place'){
        busy=false;board[a.i]=cpuMark;playCharacterPlaceSfx(cpuMark);render();
        continueCpuTurn();return;
      }
      // Haru: finish the cut-in, visibly place the selected mark, then perform the swap.
      if(a.type==='swap'){
        warpFrom=a.j;var cpuSwapTarget=a.i;consumeSkill(cpuMark);busy=true;render();
        say(cpuMark,function(){
          board[warpFrom]=cpuMark;playCharacterPlaceSfx(cpuMark);render();
          setTimeout(function(){
            board[warpFrom]=nextTurn;board[cpuSwapTarget]=cpuMark;
            fxk[warpFrom]=fxk[cpuSwapTarget]='swap';
            render();busy=false;
            finishTurnAfterLock(cpuMark,nextTurn);
          },360);
        });
        return;
      }
      busy=false;continueCpuTurn();
    },650);
  }

    lastSyncRequestRound=round;
    room.broadcast({type:'sync-request',r:round,role:myRole}).catch(function(){});
  }
  function drainRemoteLog(){
    if(remoteProcessing||!netOn||!room)return;
    if(applied>=remoteLog.length)return;
    if(busy){clearTimeout(remoteDrainTimer);remoteDrainTimer=setTimeout(drainRemoteLog,80);return;}
    if(turn!==opp(myRole)){clearTimeout(remoteDrainTimer);remoteDrainTimer=setTimeout(drainRemoteLog,100);return;}
    var token=remoteLog.charAt(applied),skillMap={E:'erase',F:'flip',S:'swap',Z:'freeze',H:'shuffle',W:'blackhole'};
    remoteProcessing=true;
    try{
      remote=true;
      if(skillMap[token]){
        useSkill(skillMap[token]);
      }else{
        var idx=parseInt(token,36);
        if(!Number.isInteger(idx)||idx<0||idx>=N*N||!cellOk(idx)){
          remote=false;remoteProcessing=false;
          var n=document.getElementById('netmsg');
          if(n)n.textContent='対局の手順が一致していません。通信を再同期してください。';
          return;
        }
        handle(idx);
      }
      applied++;
    }catch(err){
      var n2=document.getElementById('netmsg');
      if(n2)n2.textContent='相手の操作を反映できませんでした。通信を再同期してください。';
    }finally{
      remote=false;remoteProcessing=false;
    }
    if(applied<remoteLog.length){clearTimeout(remoteDrainTimer);remoteDrainTimer=setTimeout(drainRemoteLog,busy?80:0);}
  }
  function onGameBroadcast(evt){
    var data=evt&&evt.payload&&typeof evt.payload==='object'?evt.payload:evt;
    if(!data||cfg.mode!=='net'||!room)return;
    if(data.type==='sync-request'&&data.r===round&&data.role===opp(myRole)){
      sendNetLog(true);return;
    }
    if(data.type==='log'&&data.r===round&&data.role===opp(myRole)&&typeof data.log==='string'){
      if(data.log.length>200)return;
      if(data.log.length>=remoteLog.length){remoteLog=data.log;drainRemoteLog();}
    }
  }
  function peerInfo(){
    if(!room)return null;var ps=room.peers(),me=null,o=null;
    for(var i=0;i<ps.length;i++){var p=ps[i];
      if(p.isMe){if(p.sameTab)me=p;}
      else if(p.kind==='viewer'&&p.presence&&p.presence.g&&!o)o=p;}
    if(!me||!o)return null;var g=o.presence.g;
    if(!g||typeof g.r!=='number'||!CH[g.ch]||(g.h!==0&&g.h!==1))return null;
    return{me:me,o:o,g:g,mg:me.presence&&me.presence.g||{}};
  }
  function onNet(){
    var I=peerInfo(),nm=document.getElementById('netmsg'),startBtn=document.getElementById('startMatch');
    if(!I){if(room)nm.textContent='相手を待っています…(同じ合言葉を入れてもらってね)';return;}

    // Keep the two participants separate from the host/guest roles:
    // I.mg is ALWAYS this device; I.g is ALWAYS the other device.
    var selfG=I.mg||{},peerG=I.g||{};
    isHost=selfG.h===1?true:(peerG.h===1?false:I.me.peer<I.o.peer);
    myRole=isHost?'O':'X';

    // Host/guest data is used only for host-owned settings. Peer data is used
    // for all remote character, readiness, start, quit, cancel and move-log state.
    var hostG=isHost?selfG:peerG;
    var guestG=isHost?peerG:selfG;
    if(!hostG||typeof hostG.z!=='number')return;

    var peerCv=Number(peerG.cv)||0,peerQv=Number(peerG.qv)||0;
    if(peerCv!==lastPeerCancel){
      lastPeerCancel=peerCv;ready=false;startRequested=false;
      document.getElementById('bReady').hidden=false;
      document.getElementById('bReady').disabled=false;
      startBtn.hidden=true;
      document.getElementById('bCancelStart').hidden=true;
      nm.textContent='相手のキャラ選択または開始状態が変更されました。もう一度準備OKを押してください。';
      pub();
    }
    if(peerQv!==lastPeerQuit){
      lastPeerQuit=peerQv;netOn=false;ready=false;startRequested=false;over=false;
      document.getElementById('bReady').disabled=false;
      document.getElementById('bReady').hidden=false;
      startBtn.hidden=true;
      document.getElementById('bQuitMatch').hidden=true;
      document.getElementById('bCancelStart').hidden=true;
      nm.textContent='相手が試合を終了しました。キャラ選択から再戦できます。';
      setup();pub();
    }

    if(!netOn){
      // Build the same O/X -> character mapping on BOTH devices.
      if(!CH[myCh])myCh='mika';
      chars[myRole]=myCh;
      if(CH[peerG.ch])chars[opp(myRole)]=peerG.ch;

      // Host owns the shared board/rule settings; the guest mirrors them.
      if(!isHost){
        if(hostG.z===3||hostG.z===5)cfg.size=hostG.z;
        cfg.kill=!!hostG.k;cfg.skills=skillSettingFromCode(hostG.s);
        if(hostG.f==='O'||hostG.f==='X')firstChoice=hostG.f;
      }
      document.querySelectorAll('.chip[data-k="size"],.chip[data-k="kill"],.chip[data-k="skills"],.chip[data-k="first"]').forEach(function(b){
        var k=b.getAttribute('data-k'),v=b.getAttribute('data-v');
        var chosen=k==='size'?String(cfg.size):k==='kill'?(cfg.kill?'1':'0'):k==='skills'?(cfg.skills===Infinity?'inf':String(cfg.skills)):firstChoice;
        b.setAttribute('aria-pressed',v===chosen?'true':'false');
        b.disabled=(!isHost||ready||netOn)&&['size','kill','skills','first'].indexOf(k)>=0;
      });

      render();
      var charsValid=!!CH[myCh]&&!!CH[peerG.ch]&&
        chars[myRole]===myCh&&chars[opp(myRole)]===peerG.ch&&
        !!CH[hostG.ch]&&!!CH[guestG.ch];
      var peerReady=peerG.rd===1;
      var bothReady=ready&&peerReady&&charsValid;
      startBtn.hidden=!bothReady;
      if(bothReady&&startRequested)startBtn.hidden=true;

      if(!charsValid){
        nm.textContent='相手のキャラクター情報を同期中です。選択が表示されるまで待ってください。';
      }else if(ready&&!peerReady){
        nm.textContent='相手の準備を待っています…';
      }else if(bothReady){
        nm.textContent=startRequested?(peerG.go===1?'両者の開始を確認中…':'相手の「試合開始」を待っています…'):'両者準備OK！「試合開始」を押してね';
      }else{
        nm.textContent='キャラをえらんで「準備OK」を押してね（'+(myRole==='O'?'○・ホスト':'×・ゲスト')+'）';
      }

      // The host is the single authority that commits the match epoch.
      // Both players must request start, but the guest never starts from its
      // local guess: it waits for the host's explicit phase='playing'.
      document.getElementById('bCancelStart').hidden=!(bothReady&&(startRequested||peerG.go===1));
      if(isHost&&bothReady&&startRequested&&peerG.go===1&&!netOn){
        round=Math.max(round,Number(selfG.r)||0)+1;
        networkSeed=(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0;if(!networkSeed)networkSeed=1;
        netOn=true;over=false;
        chars[myRole]=myCh;chars[opp(myRole)]=peerG.ch;
        first=(round%2===1?firstChoice:opp(firstChoice));
        lg='';applied=0;remoteLog='';lastGameBroadcast='';lastSyncRequestRound=-1;
        clearTimeout(remoteDrainTimer);setup();
        startBtn.hidden=true;
        document.getElementById('bCancelStart').hidden=true;
        document.getElementById('bQuitMatch').hidden=false;
        nm.textContent='対戦開始！';
        noteEl.textContent=(first===myRole?'あなたが先攻':'相手が先攻')+'（'+(first==='O'?'○':'×')+'）';
        pub(true);
      }else if(!isHost&&bothReady&&startRequested&&peerG.go===1&&!netOn){
        var hostRound=Number(hostG.r)||0;
        if(hostG.phase==='playing'&&hostRound>round){
          round=hostRound;networkSeed=(Number(hostG.seed)||1)>>>0;netOn=true;over=false;
          chars[myRole]=myCh;chars[opp(myRole)]=peerG.ch;
          cfg.size=hostG.z;cfg.kill=!!hostG.k;cfg.skills=skillSettingFromCode(hostG.s);firstChoice=hostG.f;
          first=(round%2===1?firstChoice:opp(firstChoice));
          lg='';applied=0;remoteLog='';lastGameBroadcast='';lastSyncRequestRound=-1;
          clearTimeout(remoteDrainTimer);setup();
          startBtn.hidden=true;
          document.getElementById('bCancelStart').hidden=true;
          document.getElementById('bQuitMatch').hidden=false;
          nm.textContent='対戦開始！';
          noteEl.textContent=(first===myRole?'あなたが先攻':'相手が先攻')+'（'+(first==='O'?'○':'×')+'）';
          pub(true);
        }else{
          startBtn.hidden=true;
          nm.textContent='ホストの試合開始確定を待っています…';
        }
      }
    }

    // Gameplay moves use Broadcast, not Presence. Request the opponent's
    // retained move log once after joining/rejoining a running match.
    if(netOn&&peerG.r===round)requestGameSync();
  }
  function leaveNet(){
    clearTimeout(pubTimer);pubPending=null;clearTimeout(remoteDrainTimer);if(room){room.leave();room=null;}netOn=false;ready=false;startRequested=false;isHost=false;myRole='O';hostRules=null;lg='';applied=0;remoteLog='';lastGameBroadcast='';lastPub='';round=0;cancelVersion=0;quitVersion=0;lastPeerCancel=0;lastPeerQuit=0;lastSyncRequestRound=-1;
    document.getElementById('bReady').hidden=true;document.getElementById('bReady').disabled=false;document.getElementById('bJoin').hidden=false;
    document.getElementById('bLeaveRoom').hidden=true;document.getElementById('bReconnect').hidden=true;
    document.getElementById('bQuitMatch').hidden=true;document.getElementById('bCancelStart').hidden=true;
    document.getElementById('startMatch').hidden=true;

  function connectToRoom(code,mode){
    var nm=document.getElementById('netmsg');
    if(!/^[a-z0-9][a-z0-9_.-]{0,19}$/.test(code)){nm.textContent='合言葉は英数字で入れてください。';return;}
    if(!lobby){nm.textContent='通信ライブラリ未初期化。ページを再読み込みしてください。';return;}
    clearTimeout(pubTimer);pubPending=null;clearTimeout(remoteDrainTimer);if(room){try{room.leave();}catch(e){} room=null;}
    netOn=false;ready=false;startRequested=false;isHost=(mode==='host');myRole=isHost?'O':'X';hostRules=null;lg='';applied=0;remoteLog='';lastGameBroadcast='';lastPub='';round=0;cancelVersion=0;quitVersion=0;lastPeerCancel=0;lastPeerQuit=0;lastSyncRequestRound=-1;
    document.getElementById('bReady').hidden=true;
    document.getElementById('bReady').disabled=false;document.getElementById('startMatch').hidden=true;
    document.getElementById('bJoin').hidden=false;
    nm.textContent=(mode==='host'?'ホストルームを作成して接続中…':'ルームに参加中…');
    lobby.join('mt-'+code,function(st,detail){
      if(st==='SUBSCRIBED')nm.textContent=(mode==='host'?'ホストルーム作成OK。相手を待っています…':'ルーム接続OK。ホストを確認中…');
      else if(st==='再接続中（CLOSED）'||st==='再接続中（CHANNEL_ERROR）'||st==='再接続中（TIMED_OUT）')nm.textContent='通信が切れたため自動再接続中…（対局データは保持しています）';
      else if(st==='再接続完了'){
        nm.textContent='通信再接続OK。対局ログを再同期しています…';
        lastGameBroadcast='';lastSyncRequestRound=-1;
        setTimeout(function(){if(room&&netOn){sendNetLog(true);requestGameSync();}},250);
      }
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')nm.textContent='通信エラー：'+st+(detail?' / '+String(detail.message||detail):'');
      else nm.textContent='通信状態：'+st;
    }).then(function(r){
      room=r;round=0;lg='';applied=0;remoteLog='';lastGameBroadcast='';lastSyncRequestRound=-1;netOn=false;ready=false;lastPub='';
      r.onPeers(onNet);r.onBroadcast(onGameBroadcast);
      document.getElementById('bReady').hidden=false;
      document.getElementById('bJoin').hidden=true;
      document.getElementById('bLeaveRoom').hidden=false;
      document.getElementById('bReconnect').hidden=false;
      nm.textContent=(mode==='host'?'ホストルーム作成完了！合言葉「'+code+'」で相手を待っています。':'ルーム参加完了！ホストと接続しています…');
      pub(true);setTimeout(onNet,300);
    },function(err){
      room=null;
      nm.textContent='接続失敗：'+(err&&err.message?err.message:String(err||'原因不明'))+'。SupabaseのRealtime設定・通信環境を確認してください。';
    });
  }
  document.getElementById('bMk').addEventListener('click',function(){

    }).finally(function(){btn.disabled=false;});

  // Supabase Realtime adapter: keep the existing game UI/turn log, replace the old hosted-room dependency.
  var SUPABASE_URL='https://bccvjjtsiogmtankberh.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY='sb_publishable_bvlWUjr7baA-RoblQRgMyQ_X3Lp_VmQ';
  var sbClient=null;
  var sbClientId='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  var sbPeerOrder=Date.now()*1000+Math.floor(Math.random()*1000);
  function makeSupabaseRoomAdapter(){
    return {
      join:function(topic,onStatus){
        return new Promise(function(resolve,reject){
          if(!sbClient){reject(new Error('Supabase SDKを読み込めませんでした'));return;}
          var callbacks=[],broadcastCallbacks=[],currentChannel=null,settled=false,closedByUser=false,retryTimer=0,retryDelay=1200;
          var latestData=null,trackQueue=Promise.resolve(),broadcastQueue=Promise.resolve(),initialTimeout=0,reconnectWaiters=[];
          function notify(){callbacks.slice().forEach(function(fn){try{fn();}catch(e){}});}
          function status(st,err){if(typeof onStatus==='function')try{onStatus(st,err);}catch(e){}}
          function notifyBroadcast(evt){broadcastCallbacks.slice().forEach(function(fn){try{fn(evt);}catch(e){}});}
          function attach(ch){
            ch.on('presence',{event:'sync'},notify);
            ch.on('presence',{event:'join'},notify);
            ch.on('presence',{event:'leave'},notify);
            ch.on('broadcast',{event:'game'},notifyBroadcast);
          }
          function sendLatest(){
            if(!currentChannel||!latestData)return Promise.resolve();
            var ch=currentChannel;
            trackQueue=trackQueue.catch(function(){}).then(function(){
              if(closedByUser||ch!==currentChannel||!latestData)return;
              var payload={g:latestData.g,peer:sbPeerOrder,kind:'viewer',client:sbClientId};
              return ch.track(payload);
            });
            return trackQueue;
          }
          var adapter={
            onPeers:function(fn){callbacks.push(fn);notify();},
            onBroadcast:function(fn){broadcastCallbacks.push(fn);},
            broadcast:function(data){
              broadcastQueue=broadcastQueue.catch(function(){}).then(function(){
                if(closedByUser||!currentChannel)throw new Error('通信チャンネルが接続されていません');
                return currentChannel.send({type:'broadcast',event:'game',payload:data});
              });
              return broadcastQueue;
            },
            reconnect:function(){
              if(closedByUser)return Promise.reject(new Error('この部屋は退出済みです'));
              return new Promise(function(resolve,reject){
                var done=false,waiter=null,t=setTimeout(function(){if(done)return;done=true;reconnectWaiters=reconnectWaiters.filter(function(w){return w!==waiter;});reject(new Error('再接続がタイムアウトしました'));},15000);
                waiter={resolve:function(){if(done)return;done=true;clearTimeout(t);resolve();},reject:reject};
                reconnectWaiters.push(waiter);
                clearTimeout(retryTimer);var old=currentChannel;currentChannel=null;
                if(old){try{sbClient.removeChannel(old);}catch(e){}}
                openChannel(false);
              });
            },
            presence:function(data){latestData=data;return sendLatest();},
            peers:function(){
              var state=currentChannel?currentChannel.presenceState():{},out=[];
              Object.keys(state||{}).forEach(function(key){(state[key]||[]).forEach(function(meta){
                var isSelf=meta.client===sbClientId;
                out.push({isMe:isSelf,sameTab:isSelf,peer:Number(meta.peer)||0,kind:meta.kind||'viewer',presence:{g:meta.g}});
              });});return out;
            },
            leave:function(){closedByUser=true;clearTimeout(retryTimer);clearTimeout(initialTimeout);var ch=currentChannel;currentChannel=null;if(ch){try{sbClient.removeChannel(ch);}catch(e){}}}
          };
          function openChannel(isInitial){
            if(closedByUser)return;
            var ch=sbClient.channel(topic,{config:{presence:{key:sbClientId},broadcast:{ack:true,self:false}}});
            currentChannel=ch;attach(ch);
            ch.subscribe(function(st,err){
              if(closedByUser||ch!==currentChannel)return;
              if(st==='SUBSCRIBED'){
                retryDelay=1200;status(isInitial?'SUBSCRIBED':'再接続完了',null);
                if(!settled){settled=true;clearTimeout(initialTimeout);resolve(adapter);}
                reconnectWaiters.slice().forEach(function(w){w.resolve();});reconnectWaiters=[];
                if(latestData)sendLatest().then(notify).catch(function(e){status('送信再試行待ち',e);});
                notify();
              }else if(st==='CLOSED'||st==='CHANNEL_ERROR'||st==='TIMED_OUT'){
                status(settled?'再接続中（'+st+'）':st,err);
                var errText=String(err&&((err.message||err.reason)||err)||'');
                if(/presence|rate limit|too many/i.test(errText)){
                  status('通信更新が多すぎるため、少し待って再接続します',err);
                  retryDelay=Math.max(retryDelay,5000);
                }
                if(!settled){settled=true;clearTimeout(initialTimeout);reject(err||new Error(st));return;}
                currentChannel=null;
                try{sbClient.removeChannel(ch);}catch(e){}
                clearTimeout(retryTimer);
                retryTimer=setTimeout(function(){openChannel(false);},retryDelay);
                retryDelay=Math.min(retryDelay*1.7,10000);
              }else if(st!=='SUBSCRIBED')status(st,err);
            });
          }
          initialTimeout=setTimeout(function(){if(!settled){settled=true;if(currentChannel)try{sbClient.removeChannel(currentChannel);}catch(e){}reject(new Error('15秒以内に接続応答がありません（タイムアウト）'));}},15000);
          openChannel(true);
        });
      }
    };
  }
  function initSupabaseRoom(){
    if(!window.supabase||!window.supabase.createClient){
      var nm=document.getElementById('netmsg');if(nm)nm.textContent='通信ライブラリを読み込めません。ページを再読み込みしてください。';return;
    }
    try{sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);lobby=makeSupabaseRoomAdapter();}
    catch(e){var nm=document.getElementById('netmsg');if(nm)nm.textContent='通信設定を初期化できませんでした。';}
  }
  ['bCancelStart','bReconnect','bQuitMatch','bLeaveRoom'].forEach(function(id){var el=document.getElementById(id);if(el)el.hidden=true;});
  initSupabaseRoom();
  applySoundSetting();
  setup();
})();
